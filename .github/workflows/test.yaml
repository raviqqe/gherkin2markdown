name: test
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: go build
      - uses: golangci/golangci-lint-action@v9.3.0
      - run: go test -covermode atomic -coverprofile coverage.txt ./...
      - uses: codecov/codecov-action@v7.1.1
  spell_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: streetsidesoftware/cspell-action@v9.2.0
